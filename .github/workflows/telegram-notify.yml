name: Selectel sync Telegram notification

on:
  workflow_dispatch:
    inputs:
      notification:
        description: HTML message prepared by the Selectel sync
        required: true
        type: string

permissions: {}

jobs:
  send-telegram-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFICATION: ${{ inputs.notification }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          message = os.environ.get("NOTIFICATION", "")
          if not token or not chat_id:
              print("Telegram secrets are missing", file=sys.stderr)
              raise SystemExit(1)
          if not message:
              print("Notification message is empty", file=sys.stderr)
              raise SystemExit(1)

          body = json.dumps({
              "chat_id": chat_id,
              "text": message[:3500],
              "parse_mode": "HTML",
          }).encode("utf-8")
          request = Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urlopen(request, timeout=15) as response:
                  result = json.load(response)
          except HTTPError as error:
              print(f"Telegram returned HTTP {error.code}", file=sys.stderr)
              raise SystemExit(1)
          except URLError as error:
              print(f"Telegram connection failed: {type(error.reason).__name__}", file=sys.stderr)
              raise SystemExit(1)
          except Exception as error:
              print(f"Telegram request failed: {type(error).__name__}", file=sys.stderr)
              raise SystemExit(1)

          if result.get("ok") is not True:
              print("Telegram did not accept the notification", file=sys.stderr)
              raise SystemExit(1)
          print("Telegram notification sent")
          PY
